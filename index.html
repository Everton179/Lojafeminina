<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Essenza Feminina</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7faf9;
    color: #333;
}

/* HEADER */

header {
    background: #174c45;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.carrinho-btn {
    background: white;
    color: #174c45;
    border: none;
    padding: 11px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

/* BANNER */

.banner {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(135deg, #dceee9, #f4f8f7);
}

.banner h1 {
    font-size: 40px;
    margin-bottom: 12px;
}

.banner p {
    font-size: 18px;
    margin-bottom: 25px;
}

.botao-banner {
    display: inline-block;
    background: #174c45;
    color: white;
    padding: 13px 28px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
}

/* PRODUTOS */

.produtos {
    padding: 45px 7%;
}

.titulo {
    text-align: center;
    margin-bottom: 25px;
}

.titulo h2 {
    font-size: 30px;
    color: #174c45;
}

/* BUSCA E FILTRO */

.filtros {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

#busca {
    padding: 13px;
    width: 280px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
}

#categoria {
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

.produto {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.produto:hover {
    transform: translateY(-5px);
}

.produto img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.info {
    padding: 15px;
}

.info h3 {
    font-size: 17px;
    margin-bottom: 8px;
}

.categoria-produto {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.preco {
    font-size: 21px;
    font-weight: bold;
    color: #174c45;
    margin-bottom: 7px;
}

.estoque {
    font-size: 13px;
    color: #555;
    margin-bottom: 12px;
}

.botao {
    width: 100%;
    padding: 11px;
    border: none;
    background: #174c45;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.botao:hover {
    background: #0f3934;
}

.botao:disabled {
    background: #aaa;
    cursor: not-allowed;
}

/* CARRINHO LATERAL */

.carrinho {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    max-width: 100%;
    height: 100vh;
    background: white;
    z-index: 200;
    box-shadow: -5px 0 20px rgba(0,0,0,0.2);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
}

.carrinho.aberto {
    right: 0;
}

.carrinho-header {
    background: #174c45;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.fechar {
    background: transparent;
    color: white;
    border: none;
    font-size: 25px;
    cursor: pointer;
}

.carrinho-itens {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.item-carrinho {
    border-bottom: 1px solid #eee;
    padding: 15px 0;
}

.item-carrinho h4 {
    margin-bottom: 8px;
}

.item-controle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.item-controle button {
    width: 28px;
    height: 28px;
    border: none;
    background: #174c45;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.remover {
    background: #555 !important;
}

.carrinho-footer {
    border-top: 1px solid #ddd;
    padding: 20px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.whatsapp {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #25D366;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.whatsapp:hover {
    background: #1ebe5d;
}

/* RODAPÉ */

footer {
    background: #17201f;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 40px;
}

/* RESPONSIVO */

@media (max-width: 900px) {

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 550px) {

    header {
        padding: 15px;
    }

    .logo {
        font-size: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .banner h1 {
        font-size: 30px;
    }

    .carrinho {
        width: 100%;
    }

}

</style>
</head>

<body>


<header>

    <div class="logo">
        Essenza Feminina
    </div>

    <button class="carrinho-btn" onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="contador">0</span>)
    </button>

</header>


<section class="banner">

    <h1>Beleza que combina com você 💕</h1>

    <p>
        Produtos femininos com preços especiais
    </p>

    <a href="#produtos" class="botao-banner">
        Ver produtos
    </a>

</section>


<section class="produtos" id="produtos">

    <div class="titulo">

        <h2>Produtos</h2>

        <p>Encontre seus favoritos</p>

    </div>


    <div class="filtros">

        <input
            type="text"
            id="busca"
            placeholder="🔎 Buscar produto..."
            oninput="filtrarProdutos()"
        >

        <select id="categoria" onchange="filtrarProdutos()">

            <option value="todos">Todas as categorias</option>

            <option value="Cabelo">Cabelo</option>

            <option value="Maquiagem">Maquiagem</option>

            <option value="Skincare">Skincare</option>

            <option value="Acessórios">Acessórios</option>

        </select>

    </div>


    <div class="grid" id="listaProdutos"></div>

</section>


<!-- CARRINHO -->

<div class="carrinho" id="carrinho">

    <div class="carrinho-header">

        <h2>🛒 Meu Carrinho</h2>

        <button class="fechar" onclick="fecharCarrinho()">
            ×
        </button>

    </div>


    <div class="carrinho-itens" id="carrinhoItens">

        <p>Seu carrinho está vazio.</p>

    </div>


    <div class="carrinho-footer">

        <div class="total">
            Total: R$ <span id="total">0,00</span>
        </div>

        <button class="whatsapp" onclick="finalizarWhatsApp()">
            📱 Finalizar pedido pelo WhatsApp
        </button>

    </div>

</div>


<footer>

    <p>© 2026 Essenza Feminina</p>

    <p>Produtos femininos com preço acessível 💕</p>

</footer>


<script>

const produtos = [

    },

    },

    {

    },

    {

    {

    },

    {

        estoque: 12,
        imagem: "https://images.unsplash.com/photo-1616627561950-9f746e330187?auto=format&fit=crop&w=600&q=80"
    },

    {

        preco: 12.90,

        imagem: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?auto=format&fit=crop&w=600&q=80"
    },

    {
        id: 15,
        nome: "Carteira Feminina Compacta",
        preco: 34.90,
        categoria: "Acessórios",
        estoque: 8,
        imagem: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80"
    }

];


/* =========================
   CARRINHO
========================= */

let carrinho = [];


/* =========================
   MOSTRAR PRODUTOS
========================= */

function mostrarProdutos(lista = produtos) {

    const container = document.getElementById("listaProdutos");

    container.innerHTML = "";


    lista.forEach(produto => {

        const quantidadeNoCarrinho =
            carrinho.filter(item => item.id === produto.id)
                    .reduce((total, item) => total + item.quantidade, 0);


        const estoqueDisponivel =
            produto.estoque - quantidadeNoCarrinho;


        container.innerHTML += `

            <div class="produto">

                <img src="${produto.imagem}">

                <div class="info">

                    <h3>${produto.nome}</h3>

                    <div class="categoria-produto">
                        ${produto.categoria}
                    </div>

                    <div class="preco">
                        R$ ${produto.preco.toFixed(2).replace(".", ",")}
                    </div>

                    <div class="estoque">
                        ${estoqueDisponivel > 0
                            ? "📦 " + estoqueDisponivel + " disponíveis"
                            : "❌ Produto esgotado"}
                    </div>

                    <button
                        class="botao"
                        onclick="adicionarCarrinho(${produto.id})"
                        ${estoqueDisponivel <= 0 ? "disabled" : ""}
                    >
                        ${estoqueDisponivel > 0
                            ? "Adicionar ao carrinho"
                            : "Esgotado"}
                    </button>

                </div>

            </div>

        `;

    });

}


/* =========================
   ADICIONAR AO CARRINHO
========================= */

function adicionarCarrinho(id) {

    const produto = produtos.find(p => p.id === id);

    const item = carrinho.find(p => p.id === id);


    if (item) {

        if (item.quantidade < produto.estoque) {

            item.quantidade++;

        } else {

            alert("Esse produto não possui mais estoque.");

            return;

        }

    } else {

        carrinho.push({

            id: produto.id,
            nome: produto.nome,
            preco: produto.preco,
            quantidade: 1

        });

    }


    atualizarCarrinho();

    mostrarProdutos();

    abrirCarrinho();

}


/* =========================
   ALTERAR QUANTIDADE
========================= */

function aumentarQuantidade(id) {

    const produto = produtos.find(p => p.id === id);

    const item = carrinho.find(p => p.id === id);


    if (item.quantidade < produto.estoque) {

        item.quantidade++;

    } else {

        alert("Limite de estoque atingido.");

    }


    atualizarCarrinho();

    mostrarProdutos();

}


function diminuirQuantidade(id) {

    const item = carrinho.find(p => p.id === id);


    if (item.quantidade > 1) {

        item.quantidade--;

    } else {

        carrinho = carrinho.filter(p => p.id !== id);

    }


    atualizarCarrinho();

    mostrarProdutos();

}


/* =========================
   ATUALIZAR CARRINHO
========================= */

function atualizarCarrinho() {

    const container = document.getElementById("carrinhoItens");

    const contador = document.getElementById("contador");

    const totalElemento = document.getElementById("total");


    let quantidadeTotal = 0;

    let total = 0;


    if (carrinho.length === 0) {

        container.innerHTML =
            "<p>Seu carrinho está vazio.</p>";

    } else {

        container.innerHTML = "";


        carrinho.forEach(item => {

            quantidadeTotal += item.quantidade;

            total += item.preco * item.quantidade;


            container.innerHTML += `

                <div class="item-carrinho">

                    <h4>${item.nome}</h4>

                    <p>
                        R$ ${item.preco.toFixed(2).replace(".", ",")}
                    </p>

                    <div class="item-controle">

                        <button onclick="diminuirQuantidade(${item.id})">
                            −
                        </button>

                        <strong>
                            ${item.quantidade}
                        </strong>

                        <button onclick="aumentarQuantidade(${item.id})">
                            +
                        </button>

                        <button
                            class="remover"
                            onclick="removerProduto(${item.id})"
                        >
                            🗑
                        </button>

                    </div>

                </div>

            `;

        });

    }


    contador.innerText = quantidadeTotal;

    totalElemento.innerText =
        total.toFixed(2).replace(".", ",");

}


/* =========================
   REMOVER PRODUTO
========================= */

function removerProduto(id) {

    carrinho = carrinho.filter(item => item.id !== id);

    atualizarCarrinho();

    mostrarProdutos();

}


/* =========================
   ABRIR / FECHAR CARRINHO
========================= */

function abrirCarrinho() {

    document
        .getElementById("carrinho")
        .classList.add("aberto");

}


function fecharCarrinho() {

    document
        .getElementById("carrinho")
        .classList.remove("aberto");

}


/* =========================
   BUSCA E FILTRO
========================= */

function filtrarProdutos() {

    const busca =
        document
        .getElementById("busca")
        .value
        .toLowerCase();


    const categoria =
        document
        .getElementById("categoria")
        .value;


    const resultado = produtos.filter(produto => {

        const correspondeBusca =
            produto.nome
            .toLowerCase()
            .includes(busca);


        const correspondeCategoria =
            categoria === "todos" ||
            produto.categoria === categoria;


        return correspondeBusca &&
               correspondeCategoria;

    });


    mostrarProdutos(resultado);

}


/* =========================
   WHATSAPP
========================= */

function finalizarWhatsApp() {

    if (carrinho.length === 0) {

        alert("Seu carrinho está vazio.");

        return;

    }


    /*
       COLOQUE AQUI O NÚMERO
       DA SUA LOJA.

       Exemplo:
       5511999999999

       Sem +, espaços ou parênteses.
    */

    const numeroWhatsApp = "5571996538925";


    let mensagem =
        "Olá! Gostaria de fazer um pedido:%0A%0A";


    let total = 0;


    carrinho.forEach(item => {

        const subtotal =
            item.preco * item.quantidade;


        total += subtotal;


        mensagem +=
            "• " +
            item.nome +
            " | Quantidade: " +
            item.quantidade +
            " | R$ " +
            subtotal
            .toFixed(2)
            .replace(".", ",") +
            "%0A";

    });


    mensagem +=
        "%0A*Total: R$ " +
        total
        .toFixed(2)
        .replace(".", ",") +
        "*";


    const link =
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        mensagem;


    window.open(link, "_blank");

}


/* =========================
   INICIAR SITE
========================= */

mostrarProdutos();

atualizarCarrinho();

</script>

</html>
